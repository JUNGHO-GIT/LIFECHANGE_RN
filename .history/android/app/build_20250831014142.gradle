// android/app/build.gradle (module:app)

// ----------------------------------------------------------------------------------------------------------
// 1. plugins
// ----------------------------------------------------------------------------------------------------------
plugins {
	id("com.android.application")
	id("org.jetbrains.kotlin.android")
}

// ----------------------------------------------------------------------------------------------------------
// 1. android
// ----------------------------------------------------------------------------------------------------------
android {

	// 기본 설정 1
	namespace "com.LIFECHANGE"
	ndkVersion rootProject.ext.ndkVersion
	buildToolsVersion rootProject.ext.buildToolsVersion
	compileSdkVersion rootProject.ext.compileSdkVersion

	// 기본 설정 2
	defaultConfig {
		applicationId "com.LIFECHANGE"
		minSdkVersion rootProject.ext.minSdkVersion
		targetSdkVersion rootProject.ext.targetSdkVersion
		versionCode rootProject.ext.versionCode
		versionName rootProject.ext.versionName

		buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", "false"
		buildConfigField "boolean", "IS_HERMES_ENABLED", hermesEnabled.toBoolean() ? "true" : "false"
	}

	// 컴파일 옵션
	compileOptions {
		sourceCompatibility JavaVersion.VERSION_1_8
		targetCompatibility JavaVersion.VERSION_1_8
	}

	// 서명 설정
	signingConfigs {
		debug {
			storeFile file('debug.keystore')
			storePassword 'android'
			keyAlias 'androiddebugkey'
			keyPassword 'android'
		}
		release {
			if (project.hasProperty('RN_WIDGET_STORE_FILE')) {
				storeFile file(RN_WIDGET_STORE_FILE)
				storePassword RN_WIDGET_STORE_PASSWORD
				keyAlias RN_WIDGET_KEY_ALIAS
				keyPassword RN_WIDGET_KEY_PASSWORD
			}
			if (project.hasProperty('APP_RELEASE_STORE_FILE')) {
				storeFile file(APP_RELEASE_STORE_FILE)
				storePassword APP_RELEASE_STORE_PASSWORD
				keyAlias APP_RELEASE_KEY_ALIAS
				keyPassword APP_RELEASE_KEY_PASSWORD
			}
		}
	}

	// 빌드 타입
	buildTypes {
		debug {
			signingConfig signingConfigs.debug
		}
		release {
			signingConfig signingConfigs.release
			minifyEnabled false
			shrinkResources false
			proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
		}
	}

	// BuildConfig 생성
	buildFeatures {
		buildConfig = true
	}

	// apk 이름 변경
	applicationVariants.all { variant ->
		variant.outputs.all { output ->
			def newApkName = "LIFECHANGE_${variant.versionName}.apk"
			output.outputFileName = newApkName
		}
	}
}

// ----------------------------------------------------------------------------------------------------------
// 2. dependencies
// ----------------------------------------------------------------------------------------------------------
dependencies {
	// RN 코어
	implementation("com.facebook.react:react-android:${rootProject.ext.reactNativeVersion}")
	implementation(project(":react-native-android-widget"))

	// JS 엔진 선택
	if (hermesEnabled.toBoolean()) {
		implementation("com.facebook.react:hermes-android:${rootProject.ext.reactNativeVersion}")
	}
	else {
		implementation("org.webkit:android-jsc:+")
	}
}