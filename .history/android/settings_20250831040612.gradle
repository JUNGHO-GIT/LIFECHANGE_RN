// settings.gradle

// ----------------------------------------------------------------------------------------------------------
// 1. pluginManagement
// ----------------------------------------------------------------------------------------------------------
pluginManagement {
	repositories {
		google()
		mavenCentral()
		gradlePluginPortal()
		maven { url("$rootDir/../node_modules/react-native/android") }
		maven { url("$rootDir/../node_modules/jsc-android/dist") }
	}
	includeBuild("../node_modules/react-native-gradle-plugin")
}

// ----------------------------------------------------------------------------------------------------------
// 3. dependencyResolutionManagement
// ----------------------------------------------------------------------------------------------------------
dependencyResolutionManagement {
	repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
	repositories {
		google()
		mavenCentral()
		maven { url("$rootDir/../node_modules/react-native/android") }
		maven { url("$rootDir/../node_modules/jsc-android/dist") }
	}
}

// ----------------------------------------------------------------------------------------------------------
// 4. include modules
// ----------------------------------------------------------------------------------------------------------
rootProject.name = "LIFECHANGE"
include(":app")
include(":react-native-android-widget")
project(":react-native-android-widget").projectDir = new File(rootDir, "../node_modules/react-native-android-widget/android")
